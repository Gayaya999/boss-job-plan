<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>__TITLE__</title>
<style>
  @page { size: A4; margin: 0; }
  :root { --accent: __ACCENT__; --text: #1f2329; --sub: #5f6670; --line: #dfe3e8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #e9ecef; color: var(--text); -webkit-print-color-adjust: exact; print-color-adjust: exact;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
  .page { width: 210mm; min-height: 297mm; margin: 12px auto; background: #fff; padding: 13mm 15mm 12mm;
    box-shadow: 0 2px 12px rgba(0,0,0,.12); font-size: 10pt; line-height: 1.55; }
  body.compact .page { padding: 10mm 13mm 9mm; font-size: 9.4pt; line-height: 1.45; }
  @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; } .draft { display: none; } }

  .draft { max-width: 210mm; margin: 12px auto 0; background: #fff4e5; color: #9a3412; border: 1px solid #fdba74; border-radius: 6px;
    padding: 8px 12px; font-size: 13px; }
  mark.ph { background: #fff1a8; color: #8a5a00; padding: 0 2px; border-radius: 2px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 7px; border-bottom: 2px solid var(--accent); }
  header .left { min-width: 0; }
  header h1 { margin: 0; font-size: 20pt; letter-spacing: 1px; line-height: 1.2; }
  header .target { margin-top: 3px; font-size: 10.5pt; color: var(--accent); font-weight: 600; }
  header .contacts { text-align: right; font-size: 9pt; color: var(--sub); line-height: 1.6; }
  header .contacts a { color: var(--sub); text-decoration: none; }
  header img.photo { width: 25mm; height: 32mm; object-fit: cover; border-radius: 3px; margin-left: 10px; }
  .summary { margin: 8px 0 0; color: var(--text); }

  section { margin-top: 10px; }
  body.compact section { margin-top: 8px; }
  section h2 { margin: 0 0 5px; font-size: 11.5pt; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  section h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .entry { margin-bottom: 6px; break-inside: avoid; }
  .entry:last-child { margin-bottom: 0; }
  .entry .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .entry .title { font-weight: 700; }
  .entry .role { color: var(--sub); font-weight: 400; margin-left: 6px; }
  .entry .date { color: var(--sub); font-size: 9pt; white-space: nowrap; }
  .entry .link { font-size: 9pt; color: var(--sub); }
  .entry .link a { color: var(--accent); text-decoration: none; }
  ul { margin: 2px 0 0; padding-left: 15px; }
  li { margin: 1px 0; }
  li::marker { color: var(--accent); }

  .list-row { display: flex; justify-content: space-between; gap: 12px; margin: 1px 0; }
  .list-row .date { color: var(--sub); font-size: 9pt; white-space: nowrap; }
  .skills { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; }
  .skills .label { font-weight: 700; white-space: nowrap; }
</style>
</head>
<body class="__BODY_CLASS__">

<div class="page">
__BODY__
</div>
</body>
</html>
